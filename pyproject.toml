[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "checkdeps"
version = "1.0.0"
description = "CVE vulnerability scanner for dependency manifests"
requires-python = ">=3.11"
dependencies = [
    "packaging>=23.2",
    "requests>=2.33.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
checkdeps = "checkdeps:main"

[tool.setuptools]
py-modules = ["checkdeps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
